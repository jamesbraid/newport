[registers.wclock]
offset = 0x47e4
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "lightInitInfo (reads), initClock (writes), NetBSD rex_revision; PROM 0xbfc0fa48"
doc = "Port to the pixel clock generator and the board configuration byte; the byte is picked by CFGSEL. Reading with CFGSEL 4 (after a dummy read of the GO alias and a one microsecond wait) returns: bits 2:0 board revision, bits 5:3 monitor type, bit 6 set when no video board is present. light_init stores them in bytes 0x28, 0x2b and 0x2c of the board info. Writing with CFGSEL 2 clocks the clock generator's program bytes in: initClock writes 17 bytes in a row to the SET and GO aliases, selected by board revision (below 2: the first of the two 17-byte clock tables in the driver, 2 and above: the second). A qtest can discriminate: CFGSEL 4 then a read of GO and SET returns the configured byte; a model needs a settable board revision to take the revision 1 path (the PROM and kernel need the revision below 2 branch for the Bt479 colour map)."

[registers.rwdac]
offset = 0x47e8
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initBt479, initLUT1, lg1_mapcolor, lg2_mapcolor, light_read_bt_colormaps (light_init.o, light_tp.o, light.o); PROM 0xbfc100e0; NetBSD absent"
doc = "Port to the colour map chip. CFGSEL picks the chip register (see CFGSEL constants). Software writes the same byte to RWDAC and to its GO alias; the second write is what performs the transfer. A read of its GO alias returns the chip register's value. light_read_bt_colormaps reads the GO alias directly for the palette, the Bt479-based path also reads RWDAC; whether the SET read after a GO read adds anything: unknown, NetBSD's VC1 read does read GO then SET."

[registers.configsel]
offset = 0x47ec
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "every routine that touches a chip port; ide test mask 0x7"
doc = "Three-bit function selector shared by WCLOCK, RWDAC and RWVC1: the value written here is the chip register index the next access to any of the three ports addresses. Values 0 to 6 are used (CFGSEL constants); 7 is not written by shipped code. Readback returns the written value (lightPositionCursor saves and later restores it by reading it back). A qtest can discriminate: write 5, read back 5; write 8, read back 0 (the 0x7 mask, from the ide test)."

[registers.rwvc1]
offset = 0x47f0
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initVC1, vc1LoadSRAM, initLg1Cursor, lightPositionCursor, lightSetDisplayMode, light_read_scan; PROM 0xbfc0fd00; NetBSD rex_vc1_read, rex_vc1_write"
doc = "Port to the video controller (VC1), same SET/GO scheme as RWDAC with its GO alias 0x800 above it. NetBSD's read: write CFGSEL, read the GO alias, read the SET alias; the PROM does the same, with the kernel's read-modify-write sequences storing the value to both aliases. The VC1's internal register file behind CFGSEL is in devices/vc1."

[registers.togglectxt]
offset = 0x47f4
access = "w"
width = 32
reset = "unknown"
grade = "inferred"
from = "lightPcxSwap writes 0 at 0x47f4 between saving one window's registers and loading the next"
doc = "Written with 0 in the middle of a window context swap, after the registers for the outgoing window have been saved and before the incoming ones are loaded. Role inferred: switches REX to the other of two register contexts (its ide-visible name is not printed). Whether a read is defined: unknown."

[registers.configmode]
offset = 0x47f8
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "rex_wait NetBSD; every drawing routine; lightProbe; lightInitInfo; initRex; Lg1PixelDma; lightPcxSwap"
doc = "Configuration and status. Bit 0 is the engine busy flag: all software spins until it is clear before touching a drawing register (the kernel and the PROM do it in every drawing routine). Bits 28:24 (mask 0x1f000000) must also be zero before a VC1 access in lightPositionCursor and the retrace handler: inferred to be a count of commands still queued in the FIFO, which the busy bit alone does not cover. Bits 7:4 are read by lightInitInfo (value 0 triggers the pixel-memory probe described under rwaux1, any other value plus one is stored as a board option byte). initRex and the pixel DMA path store 0x807fe000. lightPcxSwap saves the word xor 0x80000000 and restores it unchanged, so bit 31 is read inverted of what was written. Bit 31 and bits 22:13 role: unknown. A qtest can discriminate: bit 0 reads 1 while a command is executing and 0 after; the PROM's 300000 microsecond polling loop in lightProbe (done when bit 0 clears) must not time out."

[registers.xywin]
offset = 0x47fc
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initRex stores 0x08000800; PROM 0xbfc0fd90; NetBSD light_match reads it; ide test mask 0xfff0fff"
doc = "Window origin offset: x in bits 27:16 and y in bits 11:0, 0x800 each at init (the window offset of 2048 that centres a 12-bit coordinate space; the centring is inferred). NetBSD's match accepts a board whose XYWIN reads 0x08000800. The ide test keeps 12 bits per half."
