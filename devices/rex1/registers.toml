from = "lightInitInfo (reads), initClock (writes), NetBSD rex_revision; PROM 0xbfc0fa48"
doc = "Port to the pixel clock generator and the board configuration byte; the byte is picked by CFGSEL. Reading with CFGSEL 4 (after a dummy read of the GO alias and a one microsecond wait) returns: bits 2:0 board revision, bits 5:3 monitor type, bit 6 set when no video board is present. light_init stores them in bytes 0x28, 0x2b and 0x2c of the board info. Writing with CFGSEL 2 clocks the clock generator's program bytes in: initClock writes 17 bytes in a row to the SET and GO aliases, selected by board revision (below 2: the first of the two 17-byte clock tables in the driver, 2 and above: the second). A qtest can discriminate: CFGSEL 4 then a read of GO and SET returns the configured byte; a model needs a settable board revision to take the revision 1 path (the PROM and kernel need the revision below 2 branch for the Bt479 colour map)."

[registers.rwdac]
offset = 0x47e8
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initBt479, initLUT1, lg1_mapcolor, lg2_mapcolor, light_read_bt_colormaps (light_init.o, light_tp.o, light.o); PROM 0xbfc100e0; NetBSD absent; lg1mc.so rexBlankScreen, rexDisplayCursor, rexStoreNormalColors"
doc = "Port to the colour map chip. CFGSEL picks the chip register (see CFGSEL constants). Software writes the same byte to RWDAC and to its GO alias; the second write is what performs the transfer. A read of its GO alias returns the chip register value. light_read_bt_colormaps and light_read_lut_colormaps issue one GO read, discard it, and then read the GO alias 768 times per bank (bulk reads: the same one-deep pipeline as RWVC1 fits). The X server reads the command register back (CONFIGSEL 6: GO read, then RWDAC read) for read-modify-write of the blank bit (X server driver function rexBlankScreen) and in rexDisplayCursor, so the DAC command register must be readable. Whether the SET read after a GO read adds anything beyond the pipeline: unknown."

[registers.configsel]
offset = 0x47ec
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "every routine that touches a chip port; ide test mask 0x7"
doc = "Three-bit function selector shared by WCLOCK, RWDAC and RWVC1: the value written here is the chip register index the next access to any of the three ports addresses. Values 0 to 6 are used (CFGSEL constants); 7 is not written by shipped code. Readback returns the written value (lightPositionCursor saves and later restores it by reading it back). A qtest can discriminate: write 5, read back 5; write 8, read back 0 (the 0x7 mask, from the ide test)."

[registers.rwvc1]
offset = 0x47f0
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initVC1, vc1LoadSRAM, initLg1Cursor, lightPositionCursor, lightSetDisplayMode, light_read_scan; PROM 0xbfc0fd00; NetBSD rex_vc1_read, rex_vc1_write; light_retrace.o lightRetraceHandler; light.o light_read_displaymodes, light_read_scan, lightPositionCursor"
doc = "Port to the video controller (VC1), same SET/GO scheme as RWDAC with its GO alias 0x800 above it. A write stores the byte at SET and again at GO; a GO store alone also works (lightSetDisplayMode stores only the GO alias). Reads: every reader does GO read then SET read for a single byte, and the bulk readers (light_read_displaymodes, light_read_scan) issue one GO read whose value they discard and then read only the GO alias, once per byte. Both fit a one-deep read pipeline: a GO read returns the byte fetched by the previous GO read and starts the fetch of the next, and a SET read returns the byte the last GO read fetched; a model where a GO read returns and consumes the current byte makes every bulk reader skip its first byte. The kernel retrace handler and lightPositionCursor read the VC1 address counter back through CONFIGSEL 4 (low) and 5 (high) while a user process may be in the middle of a data transfer; see devices/vc1. The VC1 internal register file behind CFGSEL is in devices/vc1."

[registers.togglectxt]
offset = 0x47f4
access = "w"
width = 32
reset = "unknown"
grade = "inferred"
from = "lightPcxSwap writes 0 at 0x47f4 between saving one window's registers and loading the next; lightPcxSwap (light.o, IRIX 5.3 0x1088)"
doc = "Written with 0 in the middle of a window context swap. lightPcxSwap reads ten registers (XSTART, YSTART, COLORRED, COLORGREEN, COLORBLUE, LSPATTERN, LSMODE, ZPATTERN, XSAVE, RWAUX1), stores 0 here, then reads about twenty-four more (XSTART, YSTART, the colour and slope registers, XENDF, YENDF, AUX1, the pattern registers, XSAVE, MINORSLOPE, XYMOVE, COLORBACK, AWEIGHT, RWAUX1, RWAUX2, RWMASK, COMMAND, SMASK1X, SMASK1Y); the load side mirrors it. Inferred from the repeated registers (XSTART, COLORRED and others appear in both passes): the engine holds two copies of part of the drawing state and a write here switches which one the register offsets address. A flat model that keeps one copy and ignores the write returns the same values in both passes and restores consistently. Whether a read is defined: unknown."

[registers.configmode]
offset = 0x47f8
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "rex_wait NetBSD; every drawing routine; lightProbe; lightInitInfo; initRex; Lg1PixelDma; lightPcxSwap; lg1mc.so rexInitHW, rexImageGlyphBltTE8, rexLineSS, rexDrawImage"
doc = "Configuration and status. Bit 0 is the engine busy flag: all software spins until it is clear before touching a drawing register (the kernel and the PROM do it in every drawing routine). Bits 28:24 (mask 0x1f000000) must also be zero before a VC1 access in lightPositionCursor and the retrace handler: inferred to be a count of commands still queued in the FIFO, which the busy bit alone does not cover. The X server polls a second count, bits 12:8 (five bits): before a burst of register stores it waits until that field is at most 21 minus its gfifo level setting, 14 at the default level 7 (rexLineSS, rexPolyPoint, rexZeroPolyArc, rexImageGlyphBltTE8; fixed limits of 5 and 8 appear in rexSolidFillSpans), so the 5-bit field is inferred to be the graphics FIFO fill level, with the level setting the number of stores the X server allows per primitive. Bits 7:4 are read by lightInitInfo (value 0 triggers the pixel-memory probe described under rwaux1, any other value plus one is stored as a board option byte). initRex and the pixel DMA path store 0x807fe000. The X server (driver function rexInitHW) stores 0x80000000 | 0x40000000 | 0x00180000 | (level << 13) with level 7 by default (see the CPU-board ranges below, or the number in the environment variable REX_GFIFO_LEVEL), raises the level field to 31 for glyph and arc runs (0xc01be000) and writes 0x80000000 | 0x00180000 | (level << 13), without bit 30, only around the pixel DMA of a large PutImage (the CPU-store PutImage path leaves bit 30 set); so bits 17:13 are inferred to be a FIFO-level threshold (the interrupt on GIO line 0 or the stall point), bits 20:19 are constant 11 in every X server store, and bit 30 is set except while the pixel DMA feeds RWAUX1 (role unknown). The default level of 7 becomes 9 or 11 only when an inventory value in the CPU-board range is read at start (0x400 to 0x43f: 9, or 11 with the board-info flags bit 6 set; 0x440 to 0x1fff: 7, or 9 with bit 6 set). lightPcxSwap saves the word xor 0x80000000 and restores it unchanged, so bit 31 is read inverted of what was written. Role of bit 31 and of bits 22:21: unknown. A qtest can discriminate: bit 0 reads 1 while a command is executing and 0 after; the PROM 300000 microsecond polling loop in lightProbe (done when bit 0 clears) must not time out; a model with synchronous drawing may return 0 in bits 28:24 and 12:8 and satisfy every shipped reader."

[registers.xywin]
offset = 0x47fc
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initRex stores 0x08000800; PROM 0xbfc0fd90; NetBSD light_match reads it; ide test mask 0xfff0fff; lg1mc.so rexCopyRect, rexDrawImage"
doc = "Window origin offset: x in bits 27:16 and y in bits 11:0, 0x800 each at init (the window offset of 2048 that centres a 12-bit coordinate space; the centring is inferred). NetBSD match accepts a board whose XYWIN reads 0x08000800. The X server stores 0x08000800 in rexInitHW and, for a right-to-left copy or a PutImage that starts below x = 4, temporarily stores 0x07fc0800 (x origin 4 lower) and loads XSTARTI and XENDI 4 higher, then restores 0x08000800 (X server driver functions rexCopyRect, rexDrawImage, rexValidateWindowPriv). Inferred from that pairing: drawing coordinate = loaded coordinate plus (x origin minus 0x800), so the pair puts the screen x of the run unchanged while keeping the engine coordinate at 4 or more; a model that applies the origin offset to the coordinates gets the right pixels, one that ignores XYWIN draws four pixels to the right. The ide test keeps 12 bits per half."
