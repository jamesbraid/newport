unit = "rex1"
prefix = "REX1"
title = "REX1 raster engine on the Indigo Entry graphics board (LG1)"
doc = "Register file of the REX1 chip as the Indigo's Entry graphics board presents it on the GIO graphics slot. Offsets are bytes from the board base (0x1f3f0000 for the first head, 0x1f3f8000 for a second). Every register is 32 bits wide. A register written at its offset is only stored (the SET alias). The same register at offset + 0x800 (the GO alias) is stored and then the latched command is executed. Names are the ones the shipped diagnostics (ide) print for the REX register test, where it prints one; the rest use the names of the NetBSD sgimips light driver. The three off-chip ports (WCLOCK, RWDAC, RWVC1) are covered here as REX registers; the chips behind them are in devices/vc1 and devices/bt479. Grades follow AGENTS.md: established means the whole routine was read in the shipped Indigo kernel graphics driver or the Indigo PROM; inferred is a reading with the reasoning given; unknown means no shipped software settles it. Nothing was measured on a board."
from = "IRIX 6.5 IP20boot lg1.a objects light.o, light_init.o, light_tp.o, light_retrace.o, light_dma.o; IP20 PROM 070-8116-004 (4.0.5D)"
public_from = ["NetBSD sgimips light driver"]
name_source = "public"
name_cite = "NetBSD sys/arch/sgimips/gio/lightreg.h and light.c for names it defines; the IRIX ide diagnostic's printed register names for the rest"

[constants]
GO_OFFSET = { value = 0x800, grade = "established", doc = "Distance from a register's SET address to its GO alias. light_sboxfi, light_pnt2i and the PROM's rectangle fill write the coordinate and colour registers at their plain offsets and then the command word at 0x800; lightProbe and the PROM probe write the command at 0 and read 0x800." }
BASE_HEAD0 = { value = 0x1f3f0000, grade = "established", doc = "Physical address of the first LG1 board, the first entry of the probe address table in the kernel driver and in the PROM." }
BASE_HEAD1 = { value = 0x1f3f8000, grade = "established", doc = "Physical address of the second board of a dual-head system, the second entry of the same probe tables." }
PROBE_READBACK = { value = 0x033c0000, grade = "established", doc = "What the XSTART register reads after 0x12345678 is written to XSTARTI. lightProbe and the PROM probe accept the board when they read it. It is 0x678 shifted left 15: XSTARTI keeps its low 12 bits and XSTART shows them from bit 15 up." }
XRES = { value = 1024, grade = "established", doc = "Horizontal resolution the kernel reports (the board info structure holds 1024 by 768) and the PROM stores." }
YRES = { value = 768, grade = "established", doc = "Vertical resolution. Drawing code addresses y as 767 minus the screen row (light_sboxfi, light_pnt2i, the PROM), and its own y counts up from the bottom, so the stored value is the row counted from the top of the screen: display row = stored y (inferred; see the Y origin section of the REX1 page)." }
CMD_DRAW = { value = 0x00000001, grade = "established", doc = "Command opcode bit: draw. Value 0 is a no-op that only latches the coordinates (NetBSD and the PROM glyph code both write it through the GO alias before a glyph)." }
CMD_BLOCK = { value = 0x00000008, grade = "established", doc = "Command flag: fill or copy a rectangle rather than a line or point. Present in every rectangle and glyph command the PROM and kernel issue." }
CMD_LENGTH32 = { value = 0x00000010, grade = "inferred", doc = "Command flag named LENGTH32 by NetBSD. Set with the 16-pixel glyph command 0x300005b9, clear with the other two glyph commands. Meaning (32-pixel run, or a pattern width) inferred from the pairing only." }
CMD_QUAD = { value = 0x00000020, grade = "inferred", doc = "Command flag named QUADMODE by NetBSD. Set in every rectangle command. Role inferred from use only." }
CMD_XYCONTINUE = { value = 0x00000080, grade = "established", doc = "Command flag: start the draw from the current XSTART/YSTART position the previous command left, not from XSTARTI/YSTARTI. Set in the glyph commands (0x300005a1, 0x300005a9, 0x300005b9) that the kernel and PROM follow with one pattern write per row." }
CMD_STOPONX = { value = 0x00000100, grade = "established", doc = "Command flag: the draw's x run ends at XENDI (inclusive; NetBSD notes the end is inclusive)." }
CMD_STOPONY = { value = 0x00000200, grade = "established", doc = "Command flag: the draw's y run ends at YENDI. Set for rectangle fill and copy, clear for the glyph rows (the glyph's y advances once per pattern write)." }
CMD_ENZPATTERN = { value = 0x00000400, grade = "established", doc = "Command flag: pixels are drawn where the ZPATTERN bit is one, taken from bit 31 downward. Used for every font glyph." }
CMD_LOGICSRC = { value = 0x00080000, grade = "inferred", doc = "Command flag: source is the frame buffer at the XYMOVE offset (a screen copy). Used with value 0x30080329 in the PROM's scroll and NetBSD's copy. Role inferred from use." }
CMD_ZOPAQUE = { value = 0x00800000, grade = "inferred", doc = "Command flag named ZOPAQUE by NetBSD: with a pattern, pattern zeros paint COLORBACK instead of leaving the pixel alone. The kernel's and the PROM's glyph commands omit it (transparent background); NetBSD sets it. Inferred from NetBSD's use against the shipped commands." }
CMD_ZCONTINUE = { value = 0x01000000, grade = "unknown", doc = "Defined by NetBSD, never set by the shipped software read." }
CMD_HOSTDATA = { value = 0x00200000, grade = "inferred", doc = "Command flag set only in the three pixel-memory probe commands (never in a fill, copy, point or glyph command). Inferred to make the draw take its pixel word from RWAUX1 (the probe writes RWAUX1 at its GO alias to run it) instead of from the colour register, and the read form to return pixels through RWAUX1; inferred from that use and from the compare constants alone." }
CMD_PIXMEM_BIT16 = { value = 0x00010000, grade = "unknown", doc = "Command bit set only in 0x30210021, the second probe write, together with AUX1 = 0x100. The probe's compare shows that with it exactly one pixel pair of the four written is replaced; which pair, and what the bit selects, is unknown." }
CMD_OP_READ = { value = 0x00000002, grade = "inferred", doc = "Opcode bit 1: set only in 0x30200023, the command whose execution (a read of RWAUX1's GO alias) returns pixel data in that read. Inferred to make opcode 3 a pixel read where opcode 1 (CMD_DRAW) is a write; opcode 2 is never issued." }
CMD_PIXMEM_WRITE_A = { value = 0x30200021, grade = "established", doc = "Probe write 1: logic op 3, bit 21, QUAD, DRAW. Run by writing 0x01081020 at the RWAUX1 GO alias with XSTARTI 0, YSTARTI 0, XENDI 3, YENDI 0, RWMASK 0xff and AUX1 0. The word is established; its effect is inferred." }
CMD_PIXMEM_WRITE_B = { value = 0x30210021, grade = "established", doc = "Probe write 2: as probe write 1 plus bit 16. Run by writing 0x09090909 at the RWAUX1 GO alias with AUX1 set to 0x100 just before. The word is established; its effect is inferred (one pixel pair replaced)." }
CMD_PIXMEM_READ = { value = 0x30200023, grade = "established", doc = "Probe read: logic op 3, bit 21, QUAD, opcode bits 1 and 0. Run by reading the RWAUX1 GO alias (the PROM reads it twice and compares the second value; the kernel compares a fresh read each time). The result 0x01080909 gives outcome 0, 0x09091020 gives outcome 1, anything else 0xff. The word is established; its effect is inferred." }
CMD_LOGICOP_SHIFT = { value = 28, grade = "established", doc = "Bits 31:28 hold the logic operation. 3 is source-replace: every command the PROM, kernel and NetBSD draw with has it (0x30000000). No other value is issued by the objects read, so the table of operations is unknown." }
CMD_FILL_RECT = { value = 0x30000329, grade = "established", doc = "Solid rectangle: logic op 3, STOPONX, STOPONY, QUAD, BLOCK, DRAW. light_sboxfi writes it at the GO alias after loading XSTARTI, YSTARTI, XENDI and YENDI; the PROM does the same." }
CMD_POINT = { value = 0x30000001, grade = "established", doc = "Single point: logic op 3, DRAW. light_pnt2i (kernel) and the PROM both store it at SET (0x0) and then read the GO alias (0x800), which runs it, after XSTARTI and YSTARTI." }
CMD_COPY_RECT = { value = 0x30080329, grade = "established", doc = "Screen copy: fill-rectangle with LOGICSRC. The PROM's scroll routine loads the four coordinates, writes XYMOVE (offset 0x34) at its GO alias, and uses this command word; NetBSD issues the same command." }
CMD_GLYPH16 = { value = 0x300005b9, grade = "established", doc = "Glyph up to 16 pixels wide: ENZPATTERN, STOPONX, XYCONTINUE, QUAD, LENGTH32, BLOCK, DRAW. light_drawbitmap issues it, then writes the ZPATTERN GO alias (0x860) once per row with the row's bits in the high 16." }
CMD_GLYPH_PIECE = { value = 0x300005a1, grade = "established", doc = "Glyph wider than 16: every 16-pixel piece except the last uses this command (no BLOCK, no LENGTH32), with XSTART advanced by the 0x10 per piece through XENDI loads. The last piece of each row uses 0x300005a9 (adds BLOCK, which is where y advances)." }
CFGSEL_DAC_ADDR = { value = 0, grade = "established", doc = "CFGSEL value that selects the colour map's address register through RWDAC and the VC1's indirect register window through RWVC1. See the register page." }
CFGSEL_PALETTE = { value = 1, grade = "established", doc = "CFGSEL 1: the colour map's palette data port; the VC1's display-mode (XMAP) window." }
CFGSEL_PIXMASK = { value = 2, grade = "established", doc = "CFGSEL 2: colour map pixel read mask (0xff written at init); VC1 external SRAM window; WCLOCK serial clock program port." }
CFGSEL_RDADDR = { value = 3, grade = "established", doc = "CFGSEL 3: colour map read-address register; VC1 test register (VC1 revision read)." }
CFGSEL_LADDR = { value = 4, grade = "established", doc = "CFGSEL 4: VC1 address low byte; read of WCLOCK returns the board configuration byte." }
CFGSEL_HADDR = { value = 5, grade = "established", doc = "CFGSEL 5: VC1 address high byte." }
CFGSEL_SYSCTL = { value = 6, grade = "established", doc = "CFGSEL 6: VC1 SYS_CTL register; colour map command register." }
VC1_SYSCTL_VIDEO_ON = { value = 0x04, grade = "established", doc = "VC1 SYS_CTL bit: video output enabled. The PROM's unblank clears it for an argument of 1 (blank) and sets it otherwise ; NetBSD's names agree." }
VC1_SYSCTL_CURSOR = { value = 0x10, grade = "inferred", doc = "VC1 SYS_CTL bit named in NetBSD for the cursor generator; kernel initialisation leaves the whole byte 0xfc." }
VC1_SYSCTL_CURSOR_ON = { value = 0x20, grade = "inferred", doc = "VC1 SYS_CTL bit named in NetBSD for cursor display; see above." }

[registers.command]
offset = 0x000
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "light_sboxfi, light_pnt2i, light_drawbitmap (light_tp.o); PROM 0xbfc2d5c0, 0xbfc2d620, 0xbfc2d684, 0xbfc2d9f8"
doc = "Drawing command. Bits 31:28 hold the logic operation, the low bits the opcode and flags listed as CMD_ constants. A write at 0x000 stores it; a write at 0x800 (or a read of 0x800) executes the command that is now latched, using the coordinate and colour registers as they stand. The PROM's probe writes 0 here and reads 0x800 (a no-op); the kernel's glyph path writes the command, then writes ZPATTERN at its GO alias once per row. A qtest can discriminate: a command written at 0x000 draws nothing, the same word at 0x800 draws, and a read of 0x800 draws what the latched command says. Bits 27:20 of values the kernel and PROM write are zero except bit 23 and bit 24 (ZOPAQUE, ZCONTINUE: not set by shipped code) and bit 21 (all three) and bit 16 (second only) in the pixel-memory probe commands 0x30200021, 0x30210021 and 0x30200023 that lightInitInfo and the PROM board-info routine use (see the CMD_PIXMEM constants and rwaux1). Bit 21 is inferred to be host data through RWAUX1, bit 1 of the last to be a read opcode, and bit 16 is unknown. The direction a pattern or block draw steps y is toward YENDI (inferred from the PROM glyphs, which end at YENDI 0, and NetBSD glyphs, which end below YSTARTI), not a fixed down."

[registers.aux1]
offset = 0x004
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initRex (light_init.o) writes 0; lightAux1Register (light.o) stores a computed word; ide REX register test (index AUX1)"
doc = "Auxiliary control word, one per window context. initRex zeroes it. lightAux1Register builds a value from a window's saved value with bits 4:2 cleared, sets bit 4 when the request word's second field is 1, bit 2 when bit 0 of its third field is set and bit 3 when bit 1 is set, then stores it here (only for the window that owns the screen) or in the window's saved context. Which pixel behaviour each of bits 2, 3 and 4 enables: unknown, no shipped code names them. The pixel-memory probe also stores 0x100 (bit 8) here before its second write; that bit's role is unknown. ide's register test reads it back whole (test mask 0x3ff)."

[registers.xstate]
offset = 0x008
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "rexClear (light_init.o) stores 0x03ff0000 here before each clear; ide REX register test prints XSTATE; offset by store position and the ide name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x8, read back 0x8, full 32 bits (helper 0xa853d718) (reviewed 2026-11-23)"
doc = "Draw x state. The only shipped write is the 0x03ff0000 that precedes each full-screen clear; the role is unknown (it may be a pre-loaded x counter for block draws; no source says). Offset established by the ide test. The ide test writes all 32 bits and expects them back unmasked."

[registers.xstarti]
offset = 0x00c
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "lightProbe, light_sboxfi, light_pnt2i; ide REX register test (write 0xc, read back XSTART 0x14, mask 0xfff shift 15); PROM probe 0xbfc0f9a8 and kernel lightProbe re-read 2026-11-23"
doc = "Draw start x as an integer. Twelve bits are kept (the ide test mask is 0xfff) and appear in XSTART at bit 15 and above: lightProbe writes 0x12345678 here and expects 0x033c0000 from XSTART. A qtest can discriminate: write 0x12345678, read XSTART at 0x14, expect 0x033c0000; whether XSTARTI itself reads back is unknown: no shipped code and not the ide test (which reads XSTART) reads offset 0xc. The ide test confirms the derivation: write at 0xc, read at 0x14, expect (value & 0xfff) << 15."

[registers.xstartf]
offset = 0x010
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (name XSTARTF, mask 0x7fffff); offset from the ide test order and the NetBSD driver's register map; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x10, read back XSTART at 0x14, mask 0x7fffff shift 4 (reviewed 2026-11-23)"
doc = "Draw start x, fraction. Test mask 0x7fffff. Offset read from the ide test. Software that draws only rectangles never writes it. Offset established by the ide test. A write here appears in XSTART bits 26:4 (the ide test reads 0x14, not 0x10). 'F' is the ide name; the readback shows the register feeds XSTART bits 26:4 (inferred as a write alias of XSTART)."

[registers.xstart]
offset = 0x014
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "lightProbe (light_init.o) and PROM 0xbfc0f9a8 read it; ide test mask 0x7ffffff"
doc = "Draw start x, integer and fraction combined: 27 bits in the ide test mask, integer in bits 26:15. Read at offset 0x14 by the board probe after XSTARTI was written; the value read is the probe's presence test (PROBE_READBACK). Whether a write here reflects in XSTARTI: unknown."

[registers.xendf]
offset = 0x018
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test name XENDF, mask 0x7ff800; offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x18, read back 0x18, mask 0x7ff800; XENDI (0x84) write read back here as value & 0xfff shifted left 11 (reviewed 2026-11-23)"
doc = "Draw end x, fraction (ide mask 0x7ff800).  Offset established by the ide test. Holds the end x with the integer in bits 22:11 (a write to XENDI at 0x84 reads back here as value & 0xfff shifted left 11; written directly, only bits 22:11 stick). Not a fraction field as the name suggests."

[registers.ystarti]
offset = 0x01c
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "light_sboxfi, light_pnt2i (store 767 minus y here); ide test mask 0xfff"
doc = "Draw start y as an integer, 12 bits kept; the ide test writes it and reads YSTART (0x24) expecting (value & 0xfff) << 15. Software stores 767 minus its own y, which counts up from the bottom, so the stored value is the display row counted from the top of the 768-line screen (inferred: the PROM console prints its first text row at the largest console y, and NetBSD stores unflipped row numbers). See the Y origin section of the REX1 page."

[registers.ystartf]
offset = 0x020
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (YSTARTF, mask 0x7fffff); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x20, read back YSTART at 0x24, mask 0x7fffff shift 4 (reviewed 2026-11-23)"
doc = "Draw start y, fraction.  Offset established by the ide test. Mirror of XSTARTF for y; a write appears in YSTART bits 26:4."

[registers.ystart]
offset = 0x024
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (YSTART, mask 0x7ffffff); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x24, read back 0x24, mask 0x7ffffff; YSTARTI (0x1c) write read back here as value & 0xfff shifted left 15 (reviewed 2026-11-23)"
doc = "Draw start y, integer and fraction combined, counterpart of XSTART. Offset inferred; no shipped code reads it. Offset established by the ide test. Combined y start, integer in bits 26:15 (the same derivation the probe uses for XSTART)."

[registers.yendf]
offset = 0x028
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (YENDF, mask 0x7ff800); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x28, read back 0x28, mask 0x7ff800; YENDI (0x88) write read back here as value & 0xfff shifted left 11 (reviewed 2026-11-23)"
doc = "Draw end y, fraction.  Offset established by the ide test. Holds the end y with the integer in bits 22:11, as XENDF."

[registers.xsave]
offset = 0x02c
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (XSAVE, mask 0xfff); lightPcxSwap (light.o) saves and restores the word at this offset; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x2c, read back 0x2c, mask 0xfff (reviewed 2026-11-23)"
doc = "Saved x start (the x that a block-draw returns to at the start of each row, inferred from its name and the context save). lightPcxSwap saves it with the other window registers. Offset established by the ide test. Twelve bits kept."

[registers.minorslope]
offset = 0x030
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test prints MINORSLOPE; offset from the NetBSD driver's register layout is not stated, so by name order between XSAVE and XYMOVE; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x30 read back 0x30, full 32 bits (helper 0xa853d7a4) (reviewed 2026-11-23)"
doc = "Line-draw minor-axis slope. Never written by the shipped light code for rectangles, text or points. Only the name (ide) and the slot between XSAVE and XYMOVE support it. Offset established by the ide test. Written and read back unmasked."

[registers.xymove]
offset = 0x034
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "PROM 0xbfc2d9f8 (stores at 0x834); NetBSD rex_copy_rect; ide test mask 0x7ff07ff"
doc = "Copy source offset: x delta in the high 16 bits and y delta in the low 16, each source minus destination (NetBSD: dx is from_x minus to_x). It is written at the GO alias after the rectangle and the copy command are set up. The ide mask 0x7ff07ff shows eleven bits kept per half. A qtest can discriminate: write 0x00100005 at 0x34 and 0x30080329 at 0, then a copy from (x+16, y+5) happens when 0x800 is touched (the polarity of y is unsettled: NetBSD computes source minus destination in top-down rows, while the PROM copy routine stores the differences of its two coordinate pairs in an order that matches only if its second pair is the source, and no caller of it was found in the 4.0.5D console code)."

[registers.colorredi]
offset = 0x038
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "light_color (light_tp.o) stores the colour index here; NetBSD fill and glyph code; ide test mask 0xff"
doc = "Foreground pixel colour (the ide test reads a write back through COLORRED at 0x3c as (value & 0xff) << 11), an 8-bit index into the colour map (the board has 8 bits per pixel). The kernel's colour routine stores the index at this offset after the busy bit clears; the PROM's colour routine does too. The ide test calls the register COLORREDI with an 8-bit mask; RED because the chip's colour path starts with red."

[registers.colorred]
offset = 0x03c
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (COLORRED, mask 0xfffff); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x3c, read back 0x3c, mask 0xfffff; COLORREDI (0x38) write read back here as value & 0xff shifted left 11 (reviewed 2026-11-23)"
doc = "Red channel with fraction for shaded draws, 20 bits in the ide mask. Offset by name order. Offset established by the ide test. COLORRED holds the red channel with its integer part (COLORREDI, 8 bits) in bits 18:11."

[registers.colorgreeni]
offset = 0x040
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (COLORGREENI, mask 0xff); NetBSD offset 0x40; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x40, read back COLORGREEN at 0x44, mask 0xff shift 11 (reviewed 2026-11-23)"
doc = "Green channel integer (shaded draws). Never written by shipped light code. Offset from the ide name order and NetBSD. Offset established by the ide test. A write here appears in COLORGREEN bits 18:11."

[registers.colorgreen]
offset = 0x044
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (COLORGREEN, mask 0xfffff); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x44, read back 0x44, mask 0xfffff (reviewed 2026-11-23)"
doc = "Green channel with fraction. Offset established by the ide test. 20 bits kept."

[registers.colorbluei]
offset = 0x048
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (COLORBLUEI, mask 0xff); NetBSD offset 0x48; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x48, read back COLORBLUE at 0x4c, mask 0xff shift 11 (reviewed 2026-11-23)"
doc = "Blue channel integer. Offset established by the ide test. A write here appears in COLORBLUE bits 18:11."

[registers.colorblue]
offset = 0x04c
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (COLORBLUE, mask 0xfffff); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x4c, read back 0x4c, mask 0xfffff (reviewed 2026-11-23)"
doc = "Blue channel with fraction. Offset established by the ide test. 20 bits kept."

[registers.slopered]
offset = 0x050
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (SLOPERED); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x50 read back 0x50 through the helper at 0xa853d87c, which compares a sign-adjusted 21-bit value (bit 19 copied to bit 20) after masking with 0x801fffff (reviewed 2026-11-23)"
doc = "Red slope for shaded lines and spans. Not written by shipped light code. Offset established by the ide test. Slope registers are signed: the ide test expects bit 19 of the stored value to read back also in bit 20."

[registers.slopegreen]
offset = 0x054
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (SLOPEGREEN); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x54, same helper as SLOPERED (reviewed 2026-11-23)"
doc = "Green slope. Not written by shipped light code. NetBSD names offset 0x54 of the configuration page WCLOCKREV, which is a different page. Offset established by the ide test. As SLOPERED."

[registers.slopeblue]
offset = 0x058
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (SLOPEBLUE); offset by name order; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x58, same helper as SLOPERED (reviewed 2026-11-23)"
doc = "Blue slope. Not written by shipped light code. Offset established by the ide test. As SLOPERED."

[registers.colorback]
offset = 0x05c
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "ide REX register test (COLORBACK, mask 0xff); NetBSD light_putchar writes it at 0x5c; ide IP20 REX register test at 0xa853d968 (helper 0xa853d670: write offset, read-back offset, mask, shift): write 0x5c, read back 0x5c, mask 0xff (reviewed 2026-11-23)"
doc = "Background colour index used for pattern zeros when ZOPAQUE is set. The shipped kernel and PROM glyph paths never write it (transparent background); NetBSD does. Offset established by the ide test. Eight bits kept."

[registers.zpattern]
offset = 0x060
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "light_drawbitmap (writes at 0x860), PROM 0xbfc2d684 (writes 0x860), NetBSD light_putchar; ide test mask all ones"
doc = "Pixel pattern for the pattern-enabled commands. Software writes it at the GO alias (0x860): each write draws one row of the glyph, taking pattern bits 31 downward, the row's bits shifted into the top half for 16-wide glyphs (the kernel shifts each halfword left by 16) and into bit 24 for 8-wide (NetBSD). With STOPONX, XYCONTINUE and BLOCK, y steps by one row after each write. A qtest can discriminate: set XSTARTI, XENDI, YSTARTI, write command 0x300005b9 at 0 and 0x80000000 at 0x860, and exactly one pixel at the start column is drawn."

