[registers.aux2]
offset = 0x47a8
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "initRex stores 0x20000000; lightSetDestinationPlanes (light.o); lightPcxSwap; ide test mask 0x7fffffff; PROM 0xbfc0fda0"
doc = "Second auxiliary control word. Both initialisations store 0x20000000. lightSetDestinationPlanes keeps bits 28:0 of the window's saved value, ORs in the request's top three bits and, for the window on screen, waits for the engine to go idle and stores the result here, so the top three bits select which plane group a draw reaches. The meaning of each of those three bits: unknown (no shipped code names the groups). The ide mask 0x7fffffff shows 31 bits kept."

