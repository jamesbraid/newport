doc = "Second auxiliary control word. Both initialisations store 0x20000000. lightSetDestinationPlanes keeps bits 28:0 of the window's saved value, ORs in the request's top three bits and, for the window on screen, waits for the engine to go idle and stores the result here, so the top three bits select which plane group a draw reaches. The shipped header names them as one three-bit code, not as three flags: NOPLANES 0, PIXELPLANES 1, OVERLAYPLANES 2 and CIDPLANES 3 (shifted left 29). The X server's plane-group writes agree: 0x20000000 for the displayed pixel planes, 0x40000000 for the overlay clear and 0x60000000 for the window-id fill, whose value is limited to 0 to 3 (rexDrawCID) like the ide CID memory test. The ide mask 0x7fffffff shows 31 bits kept. The X server's line, point and span batches (rexLineSS, rexSegmentSS, rexPolyPoint, rexSolidFillSpans) store (group << 29) | 0xf11 at the start and plain group << 29 at the end, so the low twelve bits are used and the value 0xf11 is not a command word. The header names bits 3:0 SMASK0 to SMASK3 (screen mask enables), bits 7:4 their inside/outside polarity and bits 23:8 four CID match nibbles, so 0xf11 reads as screen mask 0 enabled, inside polarity and CID match nibble 1 set to 0xf (inferred from the names; no shipped code states the effect)."

