colorhost = { bits = [6, 6], grade = "established", doc = "Take colour from the host port instead of the shading hardware; a host pixel write sets it (devices/rex3/host-pixels.md)." }
alphahost = { bits = [7, 7], grade = "established", doc = "As COLORHOST, for alpha." }
stoponx = { bits = [8, 8], grade = "established" }
stopony = { bits = [9, 9], grade = "established" }
