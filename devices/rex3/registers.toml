unit = "rex3"
prefix = "REX3"
title = "REX3 raster engine (Indy and Indigo2 graphics)"
doc = "Register file of the REX3 chip. Offsets are bytes from the REX3 base, which is 0xf0000 from the board base the public drivers map. Every register is 32 bits wide. The draw registers can be written at their own offset (the value is stored) or at the same offset plus GO_OFFSET (the value is stored and the primitive the latched draw mode describes is started); the configuration registers further up the map have the same pair, the same distance apart. Names and offsets are the ones the public Linux and NetBSD Newport headers declare, which agree where both define a register. Where only Linux declares a register the grade is inferred and the entry says so, unless a reading already in this repository confirms the offset. The drivers show what software writes and expects, not what the chip does with it: a role given from a name alone is marked inferred in the entry. Reset values are not given: no source states one. Nothing was measured on a board."
from = "Linux Newport framebuffer header (struct newport_rexregs or newport_cregs) and NetBSD sgimips Newport register header"
public_from = ["Linux Newport framebuffer header", "NetBSD sgimips Newport register header", "NetBSD sgimips Newport driver"]
name_source = "public"
name_cite = "Linux Newport framebuffer header and NetBSD sgimips Newport register header, which declare the register and field names used here; a name only Linux declares is noted in its entry"

[constants]
GO_OFFSET = { value = 0x800, grade = "established", doc = "Distance from a register's plain address to its GO alias. NetBSD writes the primitive's last register at its address plus this value; Linux declares the two copies of the register block exactly this far apart (checked with offsetof), for the draw registers and again for the configuration registers." }
BASE_FROM_BOARD = { value = 0xf0000, grade = "established", doc = "Offset of the first REX3 register from the board base, NEWPORT_REX3_OFFSET in NetBSD. Linux maps the same register file at the matching place in the Indy and Indigo2 GIO window." }
PROBE_XSTART_SHIFT = { value = 11, grade = "established", doc = "NetBSD's board probe writes 0x12345678 to XSTARTI and accepts the board when XSTART reads back the low 16 bits shifted left by this much. It follows that the integer start lives from bit 11 upward in XSTART." }

[enums.planes]
doc = "Which plane group a draw writes, as named in the public headers. NetBSD names value 1 both RGB and CI (colour index in the same plane group); value 3 and 7 are not named by either header."
values = { none = { value = 0, grade = "established" }, rgb = { value = 1, grade = "established" }, rgba = { value = 2, grade = "established" }, olay = { value = 4, grade = "established" }, pup = { value = 5, grade = "established" }, cid = { value = 6, grade = "established" } }

[enums.depth]
doc = "Frame-buffer plane depth in bits, as the headers name the values DD4, DD8, DD12 and DD24."
values = { d4 = { value = 0, grade = "established" }, d8 = { value = 1, grade = "established" }, d12 = { value = 2, grade = "established" }, d24 = { value = 3, grade = "established" } }

[enums.hostdepth]
doc = "Host pixel depth in bits. Linux names value 3 HD32 and NetBSD HD24; devices/rex3/host-pixels.md grades the packing, which has an 8-8-8-8 word."
values = { h4 = { value = 0, grade = "established" }, h8 = { value = 1, grade = "established" }, h12 = { value = 2, grade = "established" }, h32 = { value = 3, grade = "established" } }

[enums.sfactor]
doc = "Blend source factor, named as the headers name them (zero, one, destination colour, its complement, source alpha, its complement). Values 6 and 7 are not named."
values = { zero = { value = 0, grade = "established" }, one = { value = 1, grade = "established" }, dc = { value = 2, grade = "established" }, mdc = { value = 3, grade = "established" }, sa = { value = 4, grade = "established" }, msa = { value = 5, grade = "established" } }

[enums.dfactor]
doc = "Blend destination factor (zero, one, source colour, its complement, source alpha, its complement). Values 6 and 7 are not named."
values = { zero = { value = 0, grade = "established" }, one = { value = 1, grade = "established" }, sc = { value = 2, grade = "established" }, msc = { value = 3, grade = "established" }, sa = { value = 4, grade = "established" }, msa = { value = 5, grade = "established" } }

[enums.logicop]
doc = "Logic operation applied between the new and the old pixel, in the order and with the names both headers give. The value names which operation; value 3, replace, is what NetBSD's console fill and glyph code use. The operand roles follow the names and are inferred."
values = { zero = { value = 0, grade = "established" }, and = { value = 1, grade = "established" }, andr = { value = 2, grade = "established" }, src = { value = 3, grade = "established" }, andi = { value = 4, grade = "established" }, dst = { value = 5, grade = "established" }, xor = { value = 6, grade = "established" }, or = { value = 7, grade = "established" }, nor = { value = 8, grade = "established" }, xnor = { value = 9, grade = "established" }, ndst = { value = 10, grade = "established" }, orr = { value = 11, grade = "established" }, nsrc = { value = 12, grade = "established" }, ori = { value = 13, grade = "established" }, nand = { value = 14, grade = "established" }, one = { value = 15, grade = "established" } }

[enums.opcode]
doc = "Primitive opcode, as both headers name it."
values = { noop = { value = 0, grade = "established" }, read = { value = 1, grade = "established" }, draw = { value = 2, grade = "established" }, scr2scr = { value = 3, grade = "established" } }

[enums.adrmode]
doc = "Addressing mode. NetBSD defines span to aline; Linux also names the last two, which no second source confirms."
values = { span = { value = 0, grade = "established" }, block = { value = 1, grade = "established" }, iline = { value = 2, grade = "established" }, fline = { value = 3, grade = "established" }, aline = { value = 4, grade = "established" }, tline = { value = 5, grade = "inferred" }, bline = { value = 6, grade = "inferred" } }

[enums.dcbwidth]
doc = "Number of bytes of a DCBDATA word that go over the display bus, as Linux's W4, W1, W2 and W3 name the values 0 to 3 (devices/rex3/byte-lanes.md)."
values = { w4 = { value = 0, grade = "established" }, w1 = { value = 1, grade = "established" }, w2 = { value = 2, grade = "established" }, w3 = { value = 3, grade = "established" } }

[enums.dcbaddr]
doc = "Display-bus slave address. Values 0 to 9 are in both headers (NetBSD names 7 the DAC, Linux Bt445). Values 10, 11 and 15 are in Linux alone, where they select the LG3 board-version and clock chips and a reserved slot."
values = { vc2 = { value = 0, grade = "established" }, cmap_all = { value = 1, grade = "established" }, cmap0 = { value = 2, grade = "established" }, cmap1 = { value = 3, grade = "established" }, xmap_all = { value = 4, grade = "established" }, xmap0 = { value = 5, grade = "established" }, xmap1 = { value = 6, grade = "established" }, ramdac = { value = 7, grade = "established" }, video_cc1 = { value = 8, grade = "established" }, video_ab1 = { value = 9, grade = "established" }, lg3_bdvers0 = { value = 10, grade = "inferred" }, ics1562 = { value = 11, grade = "inferred" }, reserved = { value = 15, grade = "inferred" } }

[registers.drawmode1]
offset = 0x000
access = "rw"
width = 32
grade = "established"
from = "Linux Newport framebuffer header (struct newport_rexregs or newport_cregs) and NetBSD sgimips Newport register header REX3_REG_DRAWMODE1"
doc = "Draw mode word 1: the plane group and depth a draw writes, the host-port packing (RWPACKED, HOSTDEPTH, RWDOUBLE, SWAPENDIAN, written up in devices/rex3/host-pixels.md), the compare, dither, blend and logic-operation state. Every bit and value here is named at the same position in both headers (two value names differ, noted on the enums); what a bit does is graded per field, and only the host-port fields have a reading beyond the name."

[registers.drawmode1.fields]
planes = { bits = [2, 0], grade = "established", enum = "planes" }
drawdepth = { bits = [4, 3], grade = "established", enum = "depth" }
dblsrc = { bits = [5, 5], grade = "established", doc = "Named DSRC by Linux and DBLSRC by NetBSD." }
yflip = { bits = [6, 6], grade = "inferred", doc = "Named in both headers; no reading of its effect." }
rwpacked = { bits = [7, 7], grade = "established" }
hostdepth = { bits = [9, 8], grade = "established", enum = "hostdepth" }
rwdouble = { bits = [10, 10], grade = "established" }
swapendian = { bits = [11, 11], grade = "established" }
compare_lt = { bits = [12, 12], grade = "established", doc = "Compare enables LT, EQ and GT, one bit each. NetBSD sets all three in every draw it issues." }
compare_eq = { bits = [13, 13], grade = "established" }
compare_gt = { bits = [14, 14], grade = "established" }
rgbmode = { bits = [15, 15], grade = "established" }
dither = { bits = [16, 16], grade = "established", doc = "Dither enable." }
fastclear = { bits = [17, 17], grade = "established", doc = "Fast clear. NetBSD's rectangle fill sets it and loads COLORVRAM with the colour." }
blend = { bits = [18, 18], grade = "established", doc = "Blend enable." }
sfactor = { bits = [21, 19], grade = "established", enum = "sfactor" }
dfactor = { bits = [24, 22], grade = "established", enum = "dfactor" }
backblend = { bits = [25, 25], grade = "established", doc = "Back blend enable." }
prefetch = { bits = [26, 26], grade = "established", doc = "Read-ahead for programmed-I/O pixel reads, see devices/rex3/host-pixels.md." }
blendalpha = { bits = [27, 27], grade = "established", doc = "Alpha blend." }
logicop = { bits = [31, 28], grade = "established", enum = "logicop" }

[registers.drawmode0]
