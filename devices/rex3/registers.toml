access = "rw"
width = 32
grade = "established"
from = "Linux Newport framebuffer header (struct newport_rexregs or newport_cregs) and NetBSD sgimips Newport register header REX3_REG_DRAWMODE0"
doc = "Draw mode word 0, the command register: the opcode, the addressing mode and the per-primitive option bits. NetBSD's console code draws with opcode draw in block mode and copies with scr2scr; the host-pixel paths are in devices/rex3/host-pixels.md. Bit positions and names are the same in both headers, except that only Linux names addressing modes 5 and 6. What each option bit does is not read beyond its name, except where the field says otherwise."

