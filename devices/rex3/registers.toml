vidint = { bits = [6, 6], grade = "inferred", doc = "Video interrupt flag (Linux names it VIDINT)." }
glevel = { bits = [12, 7], grade = "established", doc = "Graphics FIFO level, six bits; NetBSD's wait for an empty FIFO tests it." }
blevel = { bits = [17, 13], grade = "inferred", doc = "Back-end FIFO level. NetBSD's mask covers bits 17:13; Linux's covers 18:13, so bit 18 is left out here and its owner is unknown." }
bfirq = { bits = [19, 19], grade = "inferred", doc = "Linux names it BFIRQ; no reading." }
gfirq = { bits = [20, 20], grade = "inferred", doc = "Linux names it GFIRQ; no reading." }

